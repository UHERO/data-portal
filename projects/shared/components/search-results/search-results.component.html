<table mat-table matSort [dataSource]="dataSource" class="mat-elevation-z0 striped-table">

  <!-- Series column: custom cell content (router link) -->
  <ng-container matColumnDef="series">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Series</th>
    <td mat-cell *matCellDef="let row">
      <a routerLink="/series"
         [queryParams]="{ id: row.id, sa: row.seasonality === 'seasonally adjusted' }"
         queryParamsHandling="merge">
        {{ row.series }}
      </a>
    </td>
  </ng-container>

  <!-- Region, Frequency, Seasonality: plain text cells -->
  <ng-container matColumnDef="region">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Region</th>
    <td mat-cell *matCellDef="let row">{{ row.region }}</td>
  </ng-container>

  <ng-container matColumnDef="frequency">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Frequency</th>
    <td mat-cell *matCellDef="let row">{{ row.frequency }}</td>
  </ng-container>

  <ng-container matColumnDef="seasonality">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Seasonally Adjusted</th>
    <td mat-cell *matCellDef="let row">{{ row.seasonality }}</td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
