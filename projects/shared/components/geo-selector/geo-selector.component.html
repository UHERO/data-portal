<select [ngModel]="selectedGeo?.handle" (ngModelChange)="onChange($event)" class="form-select" aria-label="geo-selector">
  @for (region of regions; track region) {
    <option [ngValue]="region?.handle">
      {{region.shortName ? region.shortName : (region.name.length > 0) ? region.name : region.handle}}
    </option>
  }
</select>
