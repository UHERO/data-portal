<select [ngModel]="selectedFreq?.freq" (ngModelChange)="onChange($event)" class="form-select" aria-label="frequency-selector">
  @if (selectedFreq?.freq === null && analyzerView) {
    <option disabled selected value="null">Index: Switch to a single frequency</option>
  }
  @for (freq of freqs; track freq) {
    <option [ngValue]="freq?.freq">
      {{freq.label || freq.freq}}
    </option>
  }
</select>
